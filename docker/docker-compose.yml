services:
  api:
    image: inventrack-api:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=InvenTrackDB;User Id=sa;Password=InvenTrack@2024!;TrustServerCertificate=True;
      - JwtSettings__SecretKey=InvenTrackSuperSecretKeyForJWT2024!AtLeast32CharsLong
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  web:
    image: inventrack-web:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=InvenTrackDB;User Id=sa;Password=InvenTrack@2024!;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "InvenTrack@2024!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "InvenTrack@2024!" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sqlserver_data:
  uploads_data:
